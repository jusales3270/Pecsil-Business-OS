# nginx do Fleetbase para a PecSil: o vhost original do fork (docker/httpd/vhost.conf, v0.7.68) com o bloqueio abaixo.
# Montado no lugar do template original pelo docker-compose.override.yml (ver infra/fleetbase/README.md).
server {
  listen 80;
  server_name localhost;
  root /fleetbase/api/public;
  # hide nginx version for security purposes
  server_tokens off;
  access_log  /var/log/nginx/access.log;
  error_log  /var/log/nginx/error_log;
  proxy_connect_timeout       600;
  proxy_send_timeout          600;
  proxy_read_timeout          600;
  send_timeout                600;
  index index.php;

  # tweaks
  client_max_body_size 600M;
  client_body_buffer_size 1m;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 16k;
  keepalive_timeout 2 2;

  #gzip tweaks
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1100;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain application/javascript application/json application/x-javascript text/xml text/css;

  #open file cache tweaks
  open_file_cache max=2000 inactive=20s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 5;
  open_file_cache_errors off;

  # PecSil (docs/PLANO-LOGISTICA.md §3): a consulta PÚBLICA pelo número de rastreio fica fechada. Ela mostra a
  # posição do motorista e o endereço a quem tiver o número, e cada abertura gasta 2 consultas pagas de rota no
  # Google, sem guarda nem limite. O link do cliente é o da plataforma (/rastreio/<código>).
  location ^~ /int/v1/fleet-ops/lookup {
    return 404;
  }

  location / {
    proxy_set_header Host            $host;
    proxy_pass   http://${NGINX_APPLICATION_HOSTNAME}:8000;
  }
}
